llm:
  provider: ${LLM_PROVIDER}
  model: ${LLM_MODEL}
  code_model: ${LLM_CODE_MODEL}
  api_key: ${LLM_API_KEY}

mcp_servers:
  anysearch:
    transport: http
    url: https://api.anysearch.com/mcp
    headers:
      Authorization: "Bearer ${ANYSEARCH_API_KEY}"
  market:
    command: bash
    args: ["-c", "cd ${REPO_ROOT} && exec uv run python -m forecasting_agent.data_server.server"]
    env:
      ANGELONE_API_KEY: ${ANGELONE_API_KEY}
      ANGELONE_CLIENT_CODE: ${ANGELONE_CLIENT_CODE}
      ANGELONE_MPIN: ${ANGELONE_MPIN}
      ANGELONE_TOTP_SECRET: ${ANGELONE_TOTP_SECRET}
      STORAGE_CONNECTION_STRING: ${STORAGE_CONNECTION_STRING}

capabilities:
  chat: llm
  search: anysearch
  sentiment: llm
  market_data: market

storage:
  connection_string: ${STORAGE_CONNECTION_STRING}

tracing:
  langfuse_public_key: ${LANGFUSE_PUBLIC_KEY}
  langfuse_secret_key: ${LANGFUSE_SECRET_KEY}
  langfuse_base_url: ${LANGFUSE_BASE_URL}

redis:
  url: ${REDIS_URL}

search:
  initial_run_budget: 20
  daily_cap: 2000
  run_ttl_seconds: 21600
  provider_timeout_ms: 15000
  max_results: 10
  allowed_domains:
    - moneycontrol.com
    - economictimes.indiatimes.com
    - livemint.com
    - bseindia.com
    - nseindia.com

sandbox:
  # 120s was sized for the old 120-day (~85 bar) window. At the 750-day (~536 bar) window the
  # price agent's walk-forward script -- which refits Ridge/LightGBM/CatBoost/AutoReg/GARCH at
  # each of ~470 steps on an expanding window -- measured 94s in this exact image, leaving only
  # 26s of headroom on a script the agent rewrites every run. 300s restores real margin while
  # still catching a genuinely hung script.
  timeoutMs: 300000
eval: {}
