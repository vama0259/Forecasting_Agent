[project]
name = "forecasting-agent"
version = "0.1.0"
description = "AI-powered forecasting agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]>=1.24.0,<2.0.0",
    "numpy>=2.5.2",
    "pandas",
    "pyarrow",
    "pydantic>=2.13",
    "scikit-learn>=1.7",
    "yfinance>=1.6.0",
    "smartapi-python>=1.5.5",
    "pyotp>=2.10.0",
    "logzero",
    "websocket-client",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25.0",
    "bandit[toml]>=1.8.0",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "hypothesis>=6.165.6",
    "import-linter>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecasting_agent"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".codex", ".agents", ".claude"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["forecasting_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.bandit]
exclude_dirs = ["tests", ".agents", ".claude", ".codex"]
skips = ["B101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
