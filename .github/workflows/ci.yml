name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .

      - name: Type-check with mypy
        run: uv run mypy src/ tests/evaluation/

      - name: Security scan with Bandit
        run: |
          uv run bandit -r src/ -c pyproject.toml -f json -o bandit-report.json || true
          uv run bandit -r src/ -c pyproject.toml -ll

      - name: Run tests
        run: uv run pytest tests/ -v

  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness

    services:
      postgres:
        # Exact match to the pgvector/Postgres versions verified locally for #8
        # (pgvector 0.8.6 on Postgres 18) so a CI pass means the same thing as
        # a local pass, not "some other Postgres happened to work."
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/harness_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
