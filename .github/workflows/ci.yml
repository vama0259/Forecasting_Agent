name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      # tests/archive/ are @pytest.mark.integration against a real Postgres (#19).
      # Same image as the harness job so a pass here means the same thing as a pass there.
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      STORAGE_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/harness_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Apply storage migrations
        # The schema lives with the TypeScript migrator, but tests/archive/ needs
        # observation_archive to exist. Applying the same .sql files keeps one source of truth
        # rather than duplicating DDL into a Python-side fixture. Uses psycopg (already a
        # project dependency) rather than psql, so this needs no client package on the runner.
        run: uv run python scripts/apply_migrations.py

      - name: Lint with Ruff
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .

      - name: Type-check with mypy
        run: uv run mypy src/ tests/evaluation/

      - name: Security scan with Bandit
        run: |
          uv run bandit -r src/ -c pyproject.toml -f json -o bandit-report.json || true
          uv run bandit -r src/ -c pyproject.toml -ll

      - name: Run tests
        run: uv run pytest tests/ -v

  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness

    services:
      postgres:
        # Exact match to the pgvector/Postgres versions verified locally for #8
        # (pgvector 0.8.6 on Postgres 18) so a CI pass means the same thing as
        # a local pass, not "some other Postgres happened to work."
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        # #21's per-run search budget ledger and run-scoped result cache are Redis-backed
        # (ADR-020). Without this service those tests do not fail fast, they hang until the
        # vitest hook timeout, which reads as a flake rather than a missing dependency.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/harness_test
      # search-observations.test.ts reads STORAGE_CONNECTION_STRING (the production variable
      # name) rather than TEST_DATABASE_URL, so both point at the same CI database.
      STORAGE_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/harness_test
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build sandbox image
        # ubuntu-latest ships Docker pre-installed, so the Docker-gated sandbox
        # tests (manager-validate.test.ts) run here rather than skipping -- but
        # only if the image they target actually exists first.
        working-directory: .
        run: docker build -f sandbox/Dockerfile -t forecasting-sandbox:latest sandbox/

      - name: Test
        run: pnpm test
