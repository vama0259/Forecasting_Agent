name: SonarCloud Analysis

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, prod]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests with coverage
        run: |
          if [ -d tests ]; then
            pytest tests/ --cov=. --cov-report=xml:coverage.xml -v || true
          else
            echo "No tests yet, skipping coverage"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=vama0259
            -Dsonar.projectKey=vama0259_Forecasting_Agent
            -Dsonar.sources=.
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/*test*/**,**/node_modules/**,.agents/**,.claude/**
