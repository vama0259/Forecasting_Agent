name: SonarCloud Analysis

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, prod]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        run: |
          if [ -d tests ]; then
            uv run pytest tests/ --cov=src --cov-report=xml:coverage.xml -v || true
          else
            echo "No tests yet, skipping coverage"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=vama0259
            -Dsonar.projectKey=vama0259_Forecasting_Agent
            -Dsonar.sources=src
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/*test*/**,**/node_modules/**,.agents/**,.claude/**
