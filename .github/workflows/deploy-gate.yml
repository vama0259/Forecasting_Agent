name: Deploy Gate

on:
  pull_request:
    branches: [prod]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run full test suite
        run: uv run pytest tests/ -v --tb=long

      - name: Check for .env or secrets
        run: |
          if find . -name ".env" -not -path "./.git/*" | grep -q .; then
            echo "::error::Found .env file — do not merge secrets into prod"
            exit 1
          fi
          echo "No secrets detected"

      - name: Verify prod readiness
        run: |
          echo "=== Prod Deploy Gate ==="
          echo "Branch: ${{ github.head_ref }} -> prod"
          echo "Commit: ${{ github.sha }}"
          echo "All checks passed — ready to merge to prod"
