name: Deploy Gate

on:
  pull_request:
    branches: [prod]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run full test suite
        run: |
          if [ -d tests ]; then pytest tests/ -v --tb=long; else echo "No tests directory found, skipping"; fi

      - name: Check for .env or secrets
        run: |
          if find . -name ".env" -not -path "./.git/*" | grep -q .; then
            echo "::error::Found .env file — do not merge secrets into prod"
            exit 1
          fi
          echo "No secrets detected"

      - name: Verify prod readiness
        run: |
          echo "=== Prod Deploy Gate ==="
          echo "Branch: ${{ github.head_ref }} -> prod"
          echo "Commit: ${{ github.sha }}"
          echo "All checks passed — ready to merge to prod"
